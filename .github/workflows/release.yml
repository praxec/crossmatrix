name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  BIN: crossmatrix-mcp

jobs:
  create-release:
    name: validate + draft release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        name: validate tag against package and server metadata
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$' \
            || { echo "::error::release tag must look like vMAJOR.MINOR.PATCH: $TAG"; exit 1; }
          # Gate the whole release on the tag matching Cargo.toml, the Cargo.lock
          # crates, server.json (top-level + every package) and npm/package.json.
          sh scripts/check-version-sync.sh --tag "$TAG"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; leaving it as-is"
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi

  binaries:
    name: build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-22.04,     ext: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, ext: tar.gz }
          - { target: x86_64-apple-darwin,        os: macos-15-intel,   ext: tar.gz }
          - { target: aarch64-apple-darwin,       os: macos-15,         ext: tar.gz }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest,   ext: zip }
          - { target: aarch64-pc-windows-msvc,    os: windows-11-arm,   ext: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: build (locked, current sources)
        shell: bash
        run: cargo build --locked --release --bin "$BIN" --target "${{ matrix.target }}"
      - name: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          asset="${BIN}-${TARGET}.${EXT}"
          mkdir -p dist
          exe=""
          [ "$EXT" = "zip" ] && exe=".exe"
          src="target/${TARGET}/release/${BIN}${exe}"
          [ -f "$src" ] || { echo "::error::built binary not found: $src"; exit 1; }
          if [ "$EXT" = "zip" ]; then
            SRC="target/${TARGET}/release/${BIN}${exe}" DEST="dist/${asset}" \
              pwsh -NoProfile -NonInteractive -Command 'Compress-Archive -Path $env:SRC -DestinationPath $env:DEST -Force'
          else
            tar -czf "dist/${asset}" -C "target/${TARGET}/release" "${BIN}"
          fi
          [ -s "dist/${asset}" ] || { echo "::error::packaged asset is empty: dist/${asset}"; exit 1; }
      - name: MCP protocol smoke on the packaged binary (initialize + tools/list)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          asset="${BIN}-${TARGET}.${EXT}"
          tmp="dist/.smoke"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          if [ "$EXT" = "zip" ]; then
            pwsh -NoProfile -NonInteractive -Command "Expand-Archive -Path 'dist/${asset}' -DestinationPath '$tmp' -Force"
          else
            tar -xzf "dist/${asset}" -C "$tmp"
          fi
          exe=""
          case "$TARGET" in *windows*) exe=".exe";; esac
          found="$(find "$tmp" -type f -name "${BIN}${exe}" | head -n 1)"
          [ -n "$found" ] || { echo "::error::packaged binary not found in dist/${asset}"; exit 1; }
          node scripts/mcp-smoke.mjs "$found"
      - name: upload packaged asset to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber

  finalize:
    name: aggregate metadata + publish
    needs: [create-release, binaries]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: download all packaged assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern '*.tar.gz' --pattern '*.zip'
      - name: aggregate checksums + manifest (fails on incomplete matrix)
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          SOURCE_SHA: ${{ needs.create-release.outputs.source_sha }}
        run: |
          set -euo pipefail
          sh scripts/release-manifest.sh --assets-dir dist --out-dir dist \
            --version "$VERSION" --source-sha "$SOURCE_SHA" --binary "$BIN"
      - name: upload aggregated metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/checksums.sha256 dist/release-manifest.json \
            scripts/install.sh scripts/install.ps1 --clobber
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Packs the npm launcher (npm/) WITH the agent skills bundled and attaches
      # the tarball with its digest. The `npm` job publishes exactly this file
      # once the release is public. `--ignore-scripts` skips the prepack hook,
      # so the skills sync must run explicitly first.
      - name: pack npm launcher with skills and attach the tarball
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          node npm/lib/sync-skills.js
          tarball="matthew-cochran-crossmatrix-${VERSION}.tgz"
          (cd npm && npm pack --ignore-scripts --pack-destination ../dist)
          [ -s "dist/${tarball}" ] || { echo "::error::npm pack did not produce dist/${tarball}"; exit 1; }
          tar -tzf "dist/${tarball}" | grep -qx 'package/skills/crossmatrix/SKILL.md' \
            || { echo "::error::dist/${tarball} does not contain package/skills/crossmatrix/SKILL.md"; exit 1; }
          # The maintainer checks the tarball against this digest before publishing.
          (cd dist && sha256sum "${tarball}" > npm-package.sha256)
          gh release upload "$TAG" "dist/${tarball}" dist/npm-package.sha256 --clobber
      - name: publish release (complete matrix verified)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false

  npm:
    name: npm publish
    needs: finalize
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    # Publication is gated on the tag matching every manifest version via
    # scripts/check-version-sync.sh in create-release, and on the repository
    # variable below. npm authenticates this job over GitHub OIDC (trusted
    # publishing: the trusted publisher on npmjs.com names praxec/crossmatrix,
    # release.yml and the `npm` environment); no NPM_TOKEN is stored. The
    # environment can require a maintainer's approval before the job starts.
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # The checkout supplies scripts/npm-publish.sh, which skips a version
      # already on npm and sends pre-releases to the `next` dist-tag.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: install npm with trusted publishing support
        run: npm install -g npm@11.6.2
      - name: download the release tarball and verify its digest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir npm-dist \
            --pattern "matthew-cochran-crossmatrix-${V}.tgz" --pattern npm-package.sha256
          (cd npm-dist && sha256sum -c npm-package.sha256)
      - name: publish (skipped if this version is already on npm)
        shell: bash
        run: |
          set -euo pipefail
          V="${TAG#v}"
          bash scripts/npm-publish.sh "npm-dist/matthew-cochran-crossmatrix-${V}.tgz" "$V"
      - name: verify the published launcher runs the release binary
        shell: bash
        run: |
          set -euo pipefail
          V="${TAG#v}"
          # The registry can take several minutes to serve a new version (v0.3.0
          # took ~5 min; v0.3.1 outlasted a 2-minute window), so wait up to ~10 min.
          for _ in $(seq 1 20); do
            if out=$(npx -y "@matthew-cochran/crossmatrix@${V}" --version 2>/dev/null) \
              && [ "$out" = "crossmatrix-mcp ${V}" ]; then
              echo "$out"
              exit 0
            fi
            sleep 30
          done
          echo "::error::npx @matthew-cochran/crossmatrix@${V} --version did not print crossmatrix-mcp ${V}"
          exit 1

  image:
    name: container image
    needs: finalize
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/praxec/crossmatrix
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  registry:
    name: MCP registry
    needs: image
    runs-on: ubuntu-22.04
    # Publishes server.json to the MCP registry under io.github.praxec/* via GitHub
    # OIDC. Non-blocking: the CLI is young, so a failure here must not red the release.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: publish to MCP registry (best-effort)
        continue-on-error: true
        run: |
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_amd64.tar.gz" -o mcp-publisher.tgz && tar xzf mcp-publisher.tgz mcp-publisher
          ./mcp-publisher login github-oidc && ./mcp-publisher publish
